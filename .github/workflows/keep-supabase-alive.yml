name: keep-supabase-alive

# Mantem o projeto Supabase (free tier) ativo, evitando a pausa por
# inatividade (que ocorre apos ~7 dias sem nenhuma query no banco).
#
# Como TESTAR agora: aba "Actions" -> "keep-supabase-alive" -> "Run workflow".
# Roda na hora e mostra o HTTP 200 nos logs.

on:
  workflow_dispatch: {}          # disparo manual (use isto para testar)
  schedule:
    # Producao: a cada 2 dias (margem confortavel do limite de 7 dias).
    - cron: "0 6 */2 * *"
    # TESTE: o minimo do GitHub e 5 minutos (3 min NAO funciona).
    # Para observar disparos automaticos, descomente a linha abaixo,
    # commite, espere alguns ciclos e DEPOIS volte a comentar.
    # - cron: "*/5 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (tiny query)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Ping em $(date -u) (UTC)"
          status=$(curl -s -o response.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/workshops?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY")
          echo "HTTP status: $status"
          echo "Resposta: $(cat response.json)"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase respondeu $status (esperado 200)"
            exit 1
          fi
          echo "OK - banco respondeu, projeto mantido ativo."
